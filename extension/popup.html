<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Loupe · URL 放大镜</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><h1>URL 放大镜</h1><p>看清 host 中的每个字符</p></header>
<div class="input-group"><label for="url">网址或域名</label><div class="input-row"><input id="url" type="text" placeholder="粘贴网址，例如 https://lnkd.in" autocomplete="off" spellcheck="false"></div></div>
<div class="examples"><span>试试看</span><button data-example="https://Inkd.in/enHTuknJ">I / l 混淆</button><button data-example="https://аррӏе.com">西里尔字母</button><button data-example="https://例子.测试">中文域名</button></div>
<p id="error" role="alert"></p>
<div id="result" aria-live="polite"></div>
<footer>地址栏输入 host 后按 Tab，可边输入边检查。<br>所有分析均在本地完成。网页中悬停链接可查看 host 高亮。<br>粉色＝非 ASCII；金框＝视觉相似字符。仅检查字符，不判断网站信誉。</footer>
<script src="vendor/punycode.js"></script><script src="vendor/confusables.js"></script><script src="analyzer.js"></script><script src="render.js"></script><script src="popup.js"></script>
</body>
</html>
